{% extends "vender/index.html" %}
{% load static %}

{% block navcontent %}
{% include 'vender/sidebar.html' with active='library' %} 
{% endblock navcontent %}
{% block content %}

<div class="dash-content" style="padding-top: 0px;     border-bottom: 4px solid var(--primary-color);">
    <div class="activity">
        <div class="title" style="margin: 0px 0px 10px 0px;">
            <div class="dash-items">
                <i class="uil uil-university"></i>
                <span class="text"> Add Library</span>
            </div>
    </div>
</div>
    
</div>
    <form class="form"  method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Django will render form fields -->
        <div class="btn">
            <button type="submit" class="submit" >Submit</button>
        </div>
    </form>
<style>
    .form {
        border: 2px solid var(--border-color);
        padding: 0.75rem;
        border-radius: 0.5rem;
    }
    
    .form{
        display: flex;
        flex-direction: column;
        gap: 2vh;
    }
    
    .form span {
        display: flex;
        justify-content:space-between;
    }
    
    .form p label {
        color: var(--text-color);
        font-size: medium;
    }
    
    .form p input,select {
        width: 100%;
        height: 5vh;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
        border-radius: 10px;
        outline: none;
        padding: 0.5rem;
    }
    
    .form p textarea {
        width: 100%;
        height: 10vh;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
        border-radius: 10px;
        outline: none;
        padding: 0.5rem;
    }
    
    .btn {
        display: flex;
        justify-content: space-evenly;
    }
    
    .btn button {
        width: 100px;
        height: 35px;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
        border-radius: 10px;
    }
    
    .submit:hover{
        background-color: var(--primary-color);
        color: white;
    }
    
    .reset:hover {
        background-color: var(--primary-color);
        color: white;
    }
</style>
{% comment %} <div class="dash-content other-content activity-container "> {% endcomment %}
{% endblock content %}
