{% extends "vender/index.html" %}
{% load static %}

{% block navcontent %}
{% include 'vender/sidebar.html' with active='plan' %} 
{% endblock navcontent %}
{% block content %}

<div class="dash-content" style="padding-top: 0px;     border-bottom: 4px solid var(--primary-color);">
    <div class="activity">
        <div class="title" style="margin: 0px 0px 10px 0px;">
            <div class="dash-items">
                <i class="uil uil-university"></i>
                <span class="text">Create Plan</span>
            </div>
    </div>
</div>
    
</div>
    <form class="form"  method="post" id="booking_form">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Django will render form fields -->
        <div class="btn">
            <button type="submit" class="submit" >Submit</button>
        </div>
    </form>
<style>
    .form {
        border: 2px solid var(--border-color);
        padding: 0.75rem;
        border-radius: 0.5rem;
    }
    
    .form{
        display: flex;
        flex-direction: column;
        gap: 2vh;
    }
    
    .form span {
        display: flex;
        justify-content:space-between;
    }
    
    .form p label {
        color: var(--text-color);
        font-size: medium;
    }
    
    .form p input,select {
        width: 100%;
        height: 5vh;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
        border-radius: 10px;
        outline: none;
        padding: 0.5rem;
    }
    
    .form p textarea {
        width: 100%;
        height: 10vh;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
        border-radius: 10px;
        outline: none;
        padding: 0.5rem;
    }
    
    .btn {
        display: flex;
        justify-content: space-evenly;
    }
    
    .btn button {
        width: 100px;
        height: 35px;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        color: var(--text-color);
        border-radius: 10px;
    }
    
    .submit:hover{
        background-color: var(--primary-color);
        color: white;
    }
    
    .reset:hover {
        background-color: var(--primary-color);
        color: white;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("id_seat").disabled = true;
        document.getElementById("id_start_time").disabled = true;
        document.getElementById("id_discount").disabled = true;
        document.getElementById("id_total_amount_to_pay").disabled = true;
    
        let MotnthlyPlanings = [];
        let availabletimming = [];
        let start_Dropdown = document.getElementById("id_start_time");
        let end_Dropdown = document.getElementById("id_end_time");
        let seatDropdown = document.getElementById("id_seat");
        let slectedPrize = 0;
        let seat_data = {};
    
        function getSeats() {
            let locationId = document.getElementById("id_location").value;
            if (!locationId) {
                alert("Please Select Library...");
                return;
            }
            let joining_date = document.getElementById("id_joining_date").value;
            if (!joining_date) {
                alert("Please Select Joining Date ...");
                return;
            }
            let plan = document.getElementById("id_plan").value;
            if (!plan) {
                alert("Please Select Plan ...");
                return;
            }
            let duration = document.getElementById("id_duration").value;
            if (!duration) {
                alert("Please Select Duration ...");
                return;
            }
    
            let dataToSend = {
                location_id: locationId,
                joining_date: joining_date,
                plan: plan,
                multiple: duration,
                csrfmiddlewaretoken: document.querySelector("input[name='csrfmiddlewaretoken']").value
            };
    
            seatDropdown.innerHTML = "";
            console.log(dataToSend)
            fetch("/api/get_seats/", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',  // Ensure JSON content type
                    'X-CSRFToken': document.querySelector('input[name="csrfmiddlewaretoken"]').value  // CSRF token for Django
                },
                body: JSON.stringify(dataToSend)
            })
                .then(response => response.json())
                .then(data => {
                    seat_data = data;
                    seatDropdown.innerHTML = '<option value="">Select</option>';
                    document.getElementById("id_total_amount_to_pay").value = parseInt(plan.split("_")[1]) * parseInt(duration);
                    for (let key in data) {
                        let option = document.createElement("option");
                        option.value = key;
                        option.textContent = data[key][0];
                        seatDropdown.appendChild(option);
                    }
                    document.getElementById("id_seat").disabled = false;
                    start_Dropdown.disabled = false;
                    calculateAmount();
                });
        }
        document.getElementById("id_seat").addEventListener("change", function() {
            console.log("hello");
        
            let seatId = this.value; // Get selected seat ID
            if (seatId) {
                console.log(seat_data[seatId][1]); // Log seat timing data
        
                let hours = parseInt(document.getElementById("id_plan").value.split("_")[0]);
                let availableTiming = getAvailableTimmig(seat_data[seatId][1], hours);
        
                updateStart(availableTiming);
        
                // Clear and populate the end time dropdown
                let endDropdown = document.getElementById("id_end_time");
                endDropdown.innerHTML = '<option value="">---------</option>';
        
                // Enable input fields
                document.getElementById("id_start_time").removeAttribute("disabled");
                document.getElementById("id_discount").removeAttribute("disabled");
                document.getElementById("id_total_amount_to_pay").removeAttribute("disabled");
        
            } else {
                let startDropdown = document.getElementById("id_start_time");
                let endDropdown = document.getElementById("id_end_time");
        
                availableTiming = [];
                startDropdown.innerHTML = '<option value="">---------</option>';
                endDropdown.innerHTML = '<option value="">---------</option>';
            }
        });

        document.getElementById("id_start_time").addEventListener("change", function() {
            console.log("hello clicked on id_start_time");
        
            let timeAfter = parseInt(this.value); // Get selected time
            let hours = parseInt(document.getElementById("id_plan").value.split("_")[0]);
            console.log(hours);
        
            const t = timeAfter + hours;
            
            if (timeAfter) {
                let endDropdown = document.getElementById("id_end_time");
                endDropdown.innerHTML = ""; // Clear previous options
                let option = document.createElement("option");
                option.value = correctIt(t % 24) + ":00:00";
                option.selected = true;
                option.textContent = timeDescription(t % 24);
                endDropdown.appendChild(option);
            }
        
            console.log("disabled");
        });
        
    
        document.getElementById("seat_finder").addEventListener("click", getSeats);
    
        function calculateAmount() {
            let duration = document.getElementById("id_duration").value;
            if (!duration) {
                alert("Please Select Duration ...");
                return;
            }
            let discount = document.getElementById("id_discount").value || 0;
            let planValue = document.getElementById("id_plan").value;
            if (planValue) {
                slectedPrize = parseFloat(planValue.split("_")[1]);
            }
            let totalAmount = parseInt(duration) * slectedPrize * (100 - parseInt(discount)) / 100;
            document.getElementById("id_total_amount_to_pay").value = totalAmount;
        }
    
        document.getElementById("id_discount").addEventListener("keyup", calculateAmount);
    
        function observeMutation(targetNode, callback) {
            let observer = new MutationObserver(callback);
            observer.observe(targetNode, { childList: true, attributes: true, subtree: true });
        }
    
        document.getElementById("booking_form").addEventListener("submit", function () {
            document.getElementById("id_total_amount_to_pay").disabled = false;
            document.getElementById("id_end_time").disabled = false;
        });
        function getAvailableTimmig(timmings,selectedTime){
            console.log(timmings,selectedTime)
            let timminingLength = timmings.length
            let selected = selectedTime
            let privious = selectedTime
            
            let i = timmings.indexOf(selected)+1
            let availabletimming = []
            console.log("finding available timming....")
            while(true){
              let index = i % timminingLength;
              let next = timmings[index];
              if(privious+1==next || (privious==23 && next==0)  ){
                // console.log(next);
                availabletimming.push(next)
                privious = next;
                i++;
              }else{
                break;
              }
              
              if(next==selected ){
                break;
              }
            }
            return availabletimming;
      }
      let forEndValueKeyTime = {}
        function updateStart(data){
            start_Dropdown.innerHTML = "";
            start_Dropdown.append('<option value="">Select</option>');
            data.forEach((value, index) => {
                forEndValueKeyTime[timeDescription(value % 24)] = `${correctIt(value)}`;
                
                let option = document.createElement("option");
                option.value = `${correctIt(value)}:00:00`;
                option.textContent = timeDescription(value % 24);
                
                start_Dropdown.appendChild(option);
            });
            
        }
        function correctIt(value){
            let h = `${value}`
            if(value<10){
                h = `0${value}`
              }
            return h
        }
        function timeDescription(hour) {
            // Check if the input is valid
            if (hour < 0 || hour > 23) {
                return "Invalid hour! Please enter a number between 0 and 23.";
            }
        
            // Determine if the time is AM or PM
            let period = hour < 12 ? 'AM' : 'PM';
            
            // Convert 24-hour time to 12-hour time
            let adjustedHour = hour % 12;
            adjustedHour = adjustedHour === 0 ? 12 : adjustedHour; // Convert hour 0 to 12
        
            // Determine the time of day (morning, evening, night)
            let timeOfDay;
            if (hour >= 5 && hour < 12) {
                timeOfDay = "morning";
            } else if (hour >= 12 && hour < 17) {
                timeOfDay = "afternoon";
            } else if (hour >= 17 && hour < 20) {
                timeOfDay = "evening";
            } else {
                timeOfDay = "night";
            }
        
            return `${adjustedHour} ${period} ${timeOfDay}`;
        }
        
    });
    
</script>
{% comment %} <div class="dash-content other-content activity-container "> {% endcomment %}
{% endblock content %}
